# Builds the eval image entirely in GCP (clones e2a, builds piguard-eval, bakes
# HF models) and pushes to Artifact Registry. Invoked by build-push.sh.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - eval/Dockerfile
      - --build-arg
      - E2A_REF=${_E2A_REF}
      - --build-arg
      - BAKE_MODELS=${_BAKE_MODELS}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  # Model bake + torch install are heavy; give the build room.
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
